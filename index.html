<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2545">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SB Portal">
<title>SB Romblon Councilor Portal</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: fixed navy sidebar (desktop) / bottom tab bar (phone); light content canvas with white panels; tables on desktop, cards on phone. */
:root{
  --navy:#0b2545; --navy-2:#13315c; --navy-ink:#c9d6ea;
  --canvas:#f4f6f9; --panel:#ffffff; --ink:#0f1b2d; --ink-2:#44546a; --muted:#6b7a90; --line:#e3e8ef; --line-2:#eef2f6;
  --accent:#1d5fbf; --accent-soft:#e8f0fc; --gold:#c9a227;
  --ok:#1f7a4d; --ok-soft:#e6f4ec; --warn:#a15c07; --warn-soft:#fdf3e3; --bad:#b42318; --bad-soft:#fdecea; --info:#1d5fbf; --info-soft:#e8f0fc; --neutral-soft:#eef1f5;
  --font:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(15,27,45,.06), 0 1px 3px rgba(15,27,45,.04);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* ----- shell ----- */
.shell{display:grid;grid-template-columns:252px 1fr;min-height:100%}
.sidebar{background:var(--navy);color:var(--navy-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px}
.seal{display:flex;gap:12px;align-items:center;padding:4px 8px 20px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:12px}
.seal .mark{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:14px;border:2px solid var(--gold);flex:none}
.seal .t1{color:#fff;font-weight:700;font-size:14px;line-height:1.25}
.seal .t2{font-size:12px;opacity:.75}
.side-nav{display:flex;flex-direction:column;gap:2px}
.side-nav .label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.55;padding:14px 10px 6px}
.side-nav a{display:flex;gap:12px;align-items:center;padding:9px 10px;border-radius:8px;color:var(--navy-ink);font-weight:500;text-decoration:none}
.side-nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.side-nav a[aria-current="page"]{background:var(--navy-2);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.side-foot{margin-top:auto;font-size:12px;opacity:.6;padding:10px}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:5}
.topbar .titles{min-width:0}
.topbar h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.topbar .crumb{font-size:12px;color:var(--muted)}
.topbar .mbrand{display:none}
.userchip{margin-left:auto;display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.userchip .nm{font-weight:600;font-size:13px;line-height:1.2}
.userchip .rl{font-size:12px;color:var(--muted)}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;color:var(--ink-2);cursor:pointer;padding:0}
.iconbtn:hover{background:var(--canvas)}
.content{padding:24px 28px 48px;max-width:1240px;width:100%;display:flex;flex-direction:column;gap:20px}
.bottomnav{display:none}
.mobile-only{display:none!important}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .sidebar{display:none}
  .topbar{padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--navy);color:#fff;border:0}
  .topbar .titles{display:none}
  .topbar .mbrand{display:flex;gap:10px;align-items:center}
  .topbar .mbrand .mark{width:32px;height:32px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:12px;border:2px solid var(--gold)}
  .topbar .mbrand .t1{font-weight:700;font-size:14px;line-height:1.2}
  .topbar .mbrand .t2{font-size:11px;opacity:.75}
  .userchip .who{display:none}
  .mobile-only{display:grid!important}
  .userchip .iconbtn{background:transparent;border-color:rgba(255,255,255,.25);color:#fff}
  .content{padding:16px 16px calc(88px + env(safe-area-inset-bottom))}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
  .bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0;text-decoration:none;font-weight:500}
  .bottomnav a[aria-current="page"]{color:var(--accent)}
  .bottomnav svg.i{width:22px;height:22px}
  .ptitle{display:flex!important}
}
.ptitle{display:none;align-items:center;justify-content:space-between;gap:12px}
.ptitle h2{font-size:20px;margin:0}

/* ----- components ----- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.panel-h h3{margin:0;font-size:15px;font-weight:700}
.panel-b{padding:16px 18px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.toolbar .left{display:flex;flex-wrap:wrap;gap:10px;align-items:center;flex:1}
.btn{font:inherit;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:9px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--canvas);text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#174f9f}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding:6px 8px}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn svg.i{width:16px;height:16px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--neutral-soft);color:var(--ink-2)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.plain::before{display:none}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)} .badge.info{background:var(--info-soft);color:var(--info)}
.muted{color:var(--muted)}
.small{font-size:12px}
.pre{white-space:pre-wrap}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}

.kpis{display:grid;gap:14px;grid-template-columns:repeat(4,1fr)}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.kpi .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.kpi .n{font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted)}
.ic.blue{background:var(--info-soft);color:var(--info)} .ic.amber{background:var(--warn-soft);color:var(--warn)}
.ic.green{background:var(--ok-soft);color:var(--ok)} .ic.slate{background:var(--neutral-soft);color:var(--ink-2)}

.cols{display:grid;gap:20px;grid-template-columns:1.4fr 1fr}
@media (max-width:1100px){.cols{grid-template-columns:1fr}}

.alertbar{display:flex;gap:16px;align-items:center;padding:16px 18px;border-radius:var(--r);background:linear-gradient(0deg,var(--warn-soft),var(--warn-soft));border:1px solid #f3dfbd}
.alertbar .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.alertbar .h{font-weight:700}
@media (max-width:600px){.alertbar{flex-direction:column;align-items:flex-start}}

.datetile{width:52px;flex:none;border:1px solid var(--line);border-radius:8px;overflow:hidden;text-align:center;background:var(--panel)}
.datetile .m{background:var(--navy);color:#fff;font-size:10px;font-weight:700;letter-spacing:.08em;padding:2px 0}
.datetile .d{font-size:20px;font-weight:700;padding:3px 0 4px;line-height:1.1}
.mrow{display:flex;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--line-2);color:inherit;text-decoration:none}
.mrow:first-child{border-top:0}
.mrow:hover{background:#fafbfd;text-decoration:none}
.mrow .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.mrow .t{font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:12px;align-items:center}
.meta span{display:inline-flex;gap:5px;align-items:center}
.meta svg.i{width:14px;height:14px}

table{width:100%;border-collapse:collapse}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;text-align:left;padding:10px 18px;background:#fafbfd;border-bottom:1px solid var(--line)}
td{padding:12px 18px;border-bottom:1px solid var(--line-2);vertical-align:middle}
th{white-space:nowrap}
tr:last-child td{border-bottom:0}
td .t{font-weight:600}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.tablewrap{overflow-x:auto}
.cards{display:none}
@media (max-width:760px){.tablewrap{display:none}.cards{display:block}}
.citem{padding:14px 16px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:6px}
.citem:first-child{border-top:0}

input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid #cfd7e2;border-radius:8px;padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:96px;resize:vertical}
.search{position:relative;flex:1 1 220px;max-width:340px}
.search svg.i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);width:16px;height:16px}
.search input{padding-left:34px}
.toolbar select{width:auto;min-width:150px}
@media (max-width:600px){.search{max-width:none;flex-basis:100%}.toolbar select{flex:1 1 140px}.toolbar>.btn{width:100%;justify-content:center}}
label{font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:6px;color:var(--ink-2)}
.hint{font-size:12px;font-weight:400;color:var(--muted)}
.form{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.form .full{grid-column:1/-1}
.form .sec{grid-column:1/-1;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding-top:6px;border-top:1px solid var(--line-2)}
@media (max-width:560px){.form{grid-template-columns:1fr}}
.checks{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.checks label{flex-direction:row;align-items:center;gap:10px;font-weight:500;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.checks input{width:auto;margin:0}
.filerow{display:grid;grid-template-columns:1fr 1.5fr auto;gap:8px}
@media (max-width:560px){.filerow{grid-template-columns:1fr}}

.overlay{position:fixed;inset:0;background:rgba(11,37,69,.45);display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;overflow-y:auto;z-index:20}
.dialog{background:var(--panel);border-radius:12px;width:100%;max-width:640px;box-shadow:0 20px 50px rgba(11,37,69,.25);display:flex;flex-direction:column}
.dialog .dh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.dialog .dh h3{margin:0;font-size:17px}
.dialog .db{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.dialog .df{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:#fafbfd;border-radius:0 0 12px 12px}
.err{color:var(--bad);font-size:13px}
.err:empty{display:none}

.notice{font-size:13px;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:#6b3d05;border:1px solid #f3dfbd}
.install{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13px;padding:10px 14px;border-radius:8px;background:var(--accent-soft);color:#123a73}

/* meeting detail */
.mhead{padding:20px 22px;display:flex;gap:18px;align-items:flex-start}
.mhead .datetile{width:64px}
.mhead .datetile .d{font-size:26px}
.mhead h2{margin:4px 0 6px;font-size:21px;letter-spacing:-.01em}
.mhead .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
@media (max-width:600px){.mhead{flex-direction:column}}
.doc{display:flex;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line-2);color:inherit;text-decoration:none}
.doc:first-child{border-top:0}
.doc:hover{background:#fafbfd;text-decoration:none}
.doc .fi{width:38px;height:38px;border-radius:8px;background:var(--info-soft);color:var(--info);display:grid;place-items:center;flex:none}
.doc .body{flex:1;min-width:0}
.doc .t{font-weight:600;overflow-wrap:anywhere}
.doc .open{color:var(--accent);font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.back{display:inline-flex;gap:6px;align-items:center;font-weight:600;font-size:13px}

.mgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.mcard{padding:18px;display:flex;flex-direction:column;gap:10px}
.mcard .top{display:flex;gap:12px;align-items:center}
.mcard .avatar{width:44px;height:44px;font-size:15px;background:var(--navy);color:#fff}
.mcard .nm{font-weight:700;font-size:15px;line-height:1.25}
.mcard .ps{font-size:12px;color:var(--muted)}
.mcard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.mcard dt{color:var(--muted)} .mcard dd{margin:0}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.login .brandside{background:var(--navy);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;background-image:radial-gradient(circle at 85% 15%,rgba(201,162,39,.18),transparent 45%),radial-gradient(circle at 10% 90%,rgba(29,95,191,.35),transparent 50%)}
.login .bigseal{width:72px;height:72px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:22px;border:3px solid var(--gold)}
.login .brandside h1{font-size:34px;line-height:1.15;margin:24px 0 8px;letter-spacing:-.02em;text-wrap:balance}
.login .brandside p{color:var(--navy-ink);max-width:420px;margin:0}
.login .formside{display:grid;place-items:center;padding:32px 20px}
.login form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px}
.login form h2{margin:0;font-size:22px}
@media (max-width:860px){.login{grid-template-columns:1fr}.login .brandside{padding:32px 24px}.login .brandside h1{font-size:24px}.login .brandside .foot{display:none}}

.side-nav{overflow-y:auto;flex:1;min-height:0;margin-right:-6px;padding-right:6px}
.side-nav .label{padding:12px 10px 4px}
.side-nav a{padding:7px 10px;font-size:13.5px}
.seal{padding-bottom:16px!important;margin-bottom:4px!important}
/* quick access + more */
.quick{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.qtile{display:flex;flex-direction:column;gap:10px;padding:16px;color:inherit;text-decoration:none}
.qtile:hover{text-decoration:none;border-color:#c8d3e1;background:#fbfcfe}
.qtile .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center}
.qtile .t{font-weight:600;font-size:13.5px;line-height:1.3}
.qtile .s{font-size:12px;color:var(--muted)}
.quick.q8{grid-template-columns:repeat(4,1fr)}
@media (max-width:560px){.quick.q8,.quick{grid-template-columns:repeat(2,1fr)}}
@media (max-height:820px) and (min-width:901px){.side-foot{display:none}}
.side-nav{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.moregroup{display:flex;flex-direction:column;gap:10px}
.moregroup h3{margin:6px 0 0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
/* calendar */
.cal-h{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.cal-h h3{margin:0;font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr)}
.cal .dow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line-2);background:#fafbfd}
.cal .day{min-height:104px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:6px 6px 8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cal .day:nth-child(7n){border-right:0}
.cal .day.out{background:#fafbfd;color:#a3adbb}
.cal .num{font-size:12px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cal .day.today .num{background:var(--accent);color:#fff}
.cal .ev{display:block;font-size:11.5px;line-height:1.3;padding:3px 6px;border-radius:5px;background:var(--info-soft);color:#123a73;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev.c{background:var(--warn-soft);color:#6b3d05}
.cal .ev.h{background:var(--ok-soft);color:#14532d}
.cal .ev:hover{text-decoration:none;filter:brightness(.97)}
@media (max-width:760px){.cal .day{min-height:64px;padding:4px}.cal .ev{font-size:0;padding:0;height:6px;border-radius:3px}.cal .dow{padding:6px 4px;text-align:center}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:10px 18px;border-top:1px solid var(--line-2)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
/* committees */
.ccard{padding:18px;display:flex;flex-direction:column;gap:12px}
.ccard h4{margin:0;font-size:15px}
.ccard .roles{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.ccard .roles span:nth-child(odd){color:var(--muted)}
.ccard .stats{display:flex;gap:16px;font-size:12px;color:var(--muted);border-top:1px solid var(--line-2);padding-top:10px}
.ccard .stats b{color:var(--ink);font-size:15px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--neutral-soft);color:var(--ink-2)}
.bar{height:8px;border-radius:999px;background:var(--line-2);overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px}
.bar i.mid{background:var(--warn)} .bar i.low{background:var(--bad)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;font:inherit;font-weight:600;font-size:13px;color:var(--muted);padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.kv{display:grid;grid-template-columns:160px 1fr;gap:10px 16px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
@media (max-width:560px){.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>

function icon(name){ const s=document.createElementNS("http://www.w3.org/2000/svg","svg"); s.setAttribute("viewBox","0 0 24 24"); s.setAttribute("class","i"); s.setAttribute("aria-hidden","true"); s.innerHTML=ICONS[name]||""; return s; }

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const el = (tag, attrs={}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (v==null || v===false) continue;
    if (k==="class") n.className=v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v===true?"":v);
  }
  for (const c of kids.flat(Infinity)) if (c!=null && c!==false) n.append(c.nodeType?c:document.createTextNode(String(c)));
  return n;
};
const today = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const asDate = d => new Date(d+"T00:00:00");
const fmtDate = d => { if(!d) return "—"; const t=asDate(d); return isNaN(t)?d:t.toLocaleDateString("en-PH",{year:"numeric",month:"short",day:"numeric"}); };
const fmtLong = d => { const t=asDate(d); return isNaN(t)?d:t.toLocaleDateString("en-PH",{weekday:"long",year:"numeric",month:"long",day:"numeric"}); };
const fmtTime = t => { const m=/^(\d{1,2}):(\d{2})$/.exec(t||""); if(!m) return t||""; let h=+m[1]; const ap=h>=12?"PM":"AM"; h=h%12||12; return `${h}:${m[2]} ${ap}`; };
const safeUrl = u => { try{ const x=new URL(u); return (x.protocol==="https:"||x.protocol==="http:")?x.href:null; }catch(_){ return null; } };
const hostOf = u => { try{ const h=new URL(u).hostname; return /drive\.google|docs\.google/.test(h)?"Google Drive":h.replace(/^www\./,""); }catch(_){ return ""; } };
const initials = n => String(n||"?").replace(/^(Hon\.|Atty\.|Dr\.|Engr\.)\s*/i,"").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"?";
const addDays = (d,n) => { const t=asDate(d); t.setDate(t.getDate()+n); const y=t.getFullYear(),m=String(t.getMonth()+1).padStart(2,"0"),dd=String(t.getDate()).padStart(2,"0"); return `${y}-${m}-${dd}`; };
const daysUntil = d => Math.round((asDate(d)-asDate(today()))/86400000);
const relDay = s => { const n=daysUntil(s.date); return n===0?"Today":n===1?"Tomorrow":(n>1&&n<=7)?`In ${n} days`:null; };

/* ================= state ================= */
const state = { user:null, profile:null, members:[], measures:[], sessions:[], announcements:[], users:[], loaded:{}, unsub:[], notice:"" };
const canEdit = () => ["admin","editor"].includes(state.profile?.role);
const isAdmin = () => state.profile?.role === "admin";
const memberName = id => { const m=state.members.find(x=>x.id===id); return m ? (m.name||"Unnamed") : "—"; };
const sortedMembers = () => [...state.members].sort((a,b)=>(a.order??99)-(b.order??99) || String(a.name).localeCompare(String(b.name)));
const upcoming = () => { const t=today(); return state.sessions.filter(s=>(s.date||"")>=t).sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||""))); };
const pastSessions = () => { const t=today(); return state.sessions.filter(s=>(s.date||"")<t).sort((a,b)=>(b.date||"").localeCompare(a.date||"")); };
const meetingTitle = s => (s.kind||"Regular Session") + (s.committee ? " — "+s.committee : "");
const whenText = s => fmtDate(s.date) + (s.time ? " · "+fmtTime(s.time) : "");
function setNotice(msg){ state.notice=msg||""; const n=$("#notice"); if(n){ n.textContent=state.notice; n.hidden=!state.notice; } }

/* ================= firebase ================= */
const configured = !!(firebaseConfig && firebaseConfig.apiKey && firebaseConfig.apiKey !== "PALITAN");
let auth=null, db=null;
if (configured) {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  try { db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
  catch(_) { db = initializeFirestore(app, {}); }
}
function stopListeners(){ state.unsub.forEach(u=>{try{u();}catch(_){}}); state.unsub=[]; }
function startData(){
  COLS.forEach(c=>{
    state.loaded[c]=false;
    state.unsub.push(onSnapshot(collection(db,c), snap=>{
      state[c]=snap.docs.map(d=>({id:d.id,...d.data()})); state.loaded[c]=true; render();
    }, err=>{ state.loaded[c]=true; setNotice("Unable to load data ("+err.code+"). Please refresh the page."); render(); }));
  });
  if (isAdmin()) state.unsub.push(onSnapshot(collection(db,"users"), snap=>{ state.users=snap.docs.map(d=>({id:d.id,...d.data()})); render(); }));
}
if (configured) {
  onAuthStateChanged(auth, user=>{
    stopListeners();
    state.user=user; state.profile=null; COLS.forEach(c=>{state[c]=[];}); state.users=[];
    if(!user){ render(); return; }
    let started=false;
    state.unsub.push(onSnapshot(doc(db,"users",user.uid), snap=>{
      const prev=state.profile?.role;
      state.profile = snap.exists() ? {id:snap.id,...snap.data()} : false;
      if(state.profile && (!started || prev!==state.profile.role)){
        const keep=state.unsub.shift(); stopListeners(); state.unsub=[keep]; started=true; startData();
      }
      render();
    }, ()=>{ state.profile=false; render(); }));
    render();
  });
}
window.addEventListener("online", ()=>setNotice(""));
window.addEventListener("offline", ()=>setNotice("You are offline. You can still view the latest data; changes will sync when your connection returns."));

async function save(col, id, data){
  data.updatedAt=new Date().toISOString(); data.updatedBy=state.user?.email||"";
  try{ if(id) await setDoc(doc(db,col,id),data); else await addDoc(collection(db,col),data); }
  catch(e){ throw friendly(e); }
}
async function remove(col,id){ try{ await deleteDoc(doc(db,col,id)); }catch(e){ throw friendly(e); } }
function friendly(e){ return new Error(e?.code==="permission-denied" ? "You don't have permission to do this. Please contact the administrator." : "Could not save. Check your connection and try again."); }

/* ================= calendar & reminders ================= */
function calDetails(s){
  const p=[]; if(s.agenda) p.push("AGENDA:\n"+s.agenda); if(s.reminders) p.push("REMINDERS:\n"+s.reminders);
  p.push("Open in portal: "+location.href.split("#")[0]+"#m-"+s.id); return p.join("\n\n");
}
function calRange(s){
  const d=s.date.replace(/-/g,"");
  if(!/^\d{1,2}:\d{2}$/.test(s.time||"")) return {allDay:true,start:d,end:addDays(s.date,1).replace(/-/g,"")};
  const [h,m]=s.time.split(":").map(Number); const pad=n=>String(n).padStart(2,"0"); const eh=Math.min(h+3,23);
  return {allDay:false,start:`${d}T${pad(h)}${pad(m)}00`,end:`${d}T${pad(eh)}${pad(h+3>23?59:m)}00`};
}
function googleCalUrl(s){
  const r=calRange(s);
  return "https://calendar.google.com/calendar/render?"+new URLSearchParams({action:"TEMPLATE",text:meetingTitle(s)+" | "+LGU.short,dates:r.start+"/"+r.end,details:calDetails(s),location:s.venue||"",ctz:"Asia/Manila"});
}
function downloadIcs(s){
  const r=calRange(s);
  const esc=t=>String(t||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;");
  const stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  const dt=r.allDay?[`DTSTART;VALUE=DATE:${r.start}`,`DTEND;VALUE=DATE:${r.end}`]:[`DTSTART;TZID=Asia/Manila:${r.start}`,`DTEND;TZID=Asia/Manila:${r.end}`];
  const alarm=(tr,l)=>["BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${esc(l)}`,`TRIGGER:${tr}`,"END:VALARM"];
  const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//SB Romblon//Councilor Portal//EN","CALSCALE:GREGORIAN",
    "BEGIN:VTIMEZONE","TZID:Asia/Manila","BEGIN:STANDARD","DTSTART:19700101T000000","TZOFFSETFROM:+0800","TZOFFSETTO:+0800","TZNAME:PHT","END:STANDARD","END:VTIMEZONE",
    "BEGIN:VEVENT",`UID:${s.id}@sb-romblon-portal`,`DTSTAMP:${stamp}`,...dt,`SUMMARY:${esc(meetingTitle(s)+" | "+LGU.short)}`,`LOCATION:${esc(s.venue)}`,`DESCRIPTION:${esc(calDetails(s))}`,
    ...alarm("-P1D","Tomorrow: "+meetingTitle(s)),...(r.allDay?[]:alarm("-PT1H","In 1 hour: "+meetingTitle(s))),"END:VEVENT","END:VCALENDAR"];
  const a=el("a",{href:URL.createObjectURL(new Blob([lines.join("\r\n")],{type:"text/calendar"})),download:`sb-meeting-${s.date}.ics`});
  document.body.append(a); a.click(); a.remove();
}

/* ================= install ================= */
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); deferredPrompt=e; render(); });
function installBar(){
  if(matchMedia("(display-mode: standalone)").matches || navigator.standalone) return null;
  try{ if(localStorage.getItem("sb-hide-install")) return null; }catch(_){}
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(!deferredPrompt && !ios) return null;
  const hide=()=>{ try{localStorage.setItem("sb-hide-install","1");}catch(_){} render(); };
  return el("div",{class:"install"},
    el("span",{}, deferredPrompt ? "Install the portal on this device for one-tap access." : "To install on iPhone: tap Share, then “Add to Home Screen”."),
    el("div",{style:"display:flex;gap:8px"},
      deferredPrompt ? el("button",{class:"btn primary",type:"button",onclick:async()=>{ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; render(); }},"Install app") : null,
      el("button",{class:"btn ghost",type:"button",onclick:hide},"Dismiss")));
}
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

/* ================= render ================= */
function render(){
  const root=$("#root");
  if(!configured){ root.replaceChildren(loginShell(el("div",{class:"stack",style:"display:flex;flex-direction:column;gap:12px;max-width:380px"},
    el("h2",{style:"margin:0"},"Setup required"),
    el("p",{class:"muted",style:"margin:0"},"Open firebase-config.js and paste your Firebase project configuration. See GABAY.md for step-by-step instructions."))));
    return; }
  if(!state.user){ root.replaceChildren(loginShell(loginForm())); return; }
  if(state.profile===null){ root.replaceChildren(loginShell(el("p",{class:"muted"},"Checking your access…"))); return; }
  if(state.profile===false){ root.replaceChildren(loginShell(noAccess())); return; }

  let r=route(); if(r==="access" && !isAdmin()) r="dashboard";
  const isMeeting=r.startsWith("m-");
  const key=isMeeting?"sessions":r; const page=PAGES[key];
  const body=isMeeting?viewMeeting(r.slice(2)):page.view();

  const groups=[]; visiblePages().forEach(([k,p])=>{ let g=groups.find(x=>x.name===p.group); if(!g){g={name:p.group,items:[]};groups.push(g);} g.items.push([k,p]); });
  const sideNav=groups.map(g=>[el("div",{class:"label"},g.name),g.items.map(([k,p])=>el("a",{href:"#"+k,"aria-current":k===key?"page":null},icon(p.icon),p.short&&p.title.length>24?p.short:p.title))]);
  const BOTTOM=["dashboard","calendar","sessions","measures"];
  const inBottom=BOTTOM.includes(key);
  const bottomNav=[...BOTTOM.map(k=>el("a",{href:"#"+k,"aria-current":k===key?"page":null},icon(PAGES[k].icon),PAGES[k].short||PAGES[k].title)),
    el("a",{href:"#more","aria-current":!inBottom?"page":null},icon("grid"),"More")];
  const role=(ROLES.find(x=>x[0]===state.profile.role)||[,""])[1];
  const name=state.profile.name||state.user.email;

  root.replaceChildren(el("div",{class:"shell"},
    el("aside",{class:"sidebar"},
      el("div",{class:"seal"},el("div",{class:"mark"},"SB"),el("div",{},el("div",{class:"t1"},LGU.body),el("div",{class:"t2"},LGU.place))),
      el("nav",{class:"side-nav","aria-label":"Main"},sideNav),
      el("div",{class:"side-foot"},"Councilor Portal · Internal use only")),
    el("div",{class:"main"},
      el("header",{class:"topbar"},
        el("div",{class:"mbrand"},el("div",{class:"mark"},"SB"),el("div",{},el("div",{class:"t1"},LGU.short),el("div",{class:"t2"},"Councilor Portal"))),
        el("div",{class:"titles"},el("div",{class:"crumb"},LGU.body+" · "+LGU.place),el("h1",{},isMeeting?"Meeting Details":page.title)),
        el("div",{class:"userchip"},

    fld("Document link",inp("link",m.link,{type:"url",placeholder:"https://drive.google.com/…"}),true,"Paste a Google Drive link to the draft or approved copy."),
    fld("Notes",txt("notes",m.notes,"Amendments, hearing dates, remarks…"),true)
  ], fd=>{
    const d=Object.fromEntries(fd); d.title=(d.title||"").trim(); d.link=(d.link||"").trim();
    if(!d.title) return "Please enter a title."; if(d.link&&!safeUrl(d.link)) return "The document link must start with https://";
    return save("measures",m.id,d);
  }, m.id?()=>remove("measures",m.id):null);
}
function sessionForm(s={}){
  const present=new Set(s.present||[]);
  const att=el("div",{class:"checks"}, sortedMembers().length?sortedMembers().map(m=>el("label",{},
    el("input",{type:"checkbox",name:"present",value:m.id,id:"att-"+m.id,checked:present.has(m.id)}),m.name||"Unnamed"))
    :el("span",{class:"muted"},"Add members first to record attendance."));
  const rows=el("div",{style:"display:flex;flex-direction:column;gap:8px"});
  const addRow=(f={})=>{ const r=el("div",{class:"filerow"},
      el("input",{name:"fileLabel",placeholder:"Document name (e.g. Draft Ordinance)",value:f.label||"","aria-label":"Document name"}),
      el("input",{name:"fileUrl",type:"url",placeholder:"https://drive.google.com/…",value:f.url||"","aria-label":"Document link"}),
      el("button",{type:"button",class:"iconbtn","aria-label":"Remove document",onclick:()=>r.remove()},icon("x"))); rows.append(r); };
  (s.files&&s.files.length?s.files:[{}]).forEach(addRow);
  const chosen=new Set(s.measureIds||[]);
  const openM=state.measures.filter(m=>!CLOSED.includes(m.status)||chosen.has(m.id)).sort((a,b)=>String(a.number).localeCompare(String(b.number)));
  const mList=el("div",{class:"checks"},openM.length?openM.map(m=>el("label",{},
    el("input",{type:"checkbox",name:"measureIds",value:m.id,id:"mm-"+m.id,checked:chosen.has(m.id)}),(m.number?m.number+" — ":"")+(m.title||"").slice(0,60)))
    :el("span",{class:"muted"},"No open measures."));
  openDialog(s.id?"Edit meeting":"New meeting",[
    sec("Details"),
    fld("Type",sel("kind",KINDS,s.kind||"Regular Session")),
    fld("Committee",inp("committee",s.committee,{list:"committee-list",placeholder:"For committee meetings"})),
    committeeDatalist(),
    fld("Date",inp("date",s.date||today(),{type:"date"})),
    fld("Time",inp("time",/^\d{1,2}:\d{2}$/.test(s.time||"")?s.time:"",{type:"time"})),
    fld("Venue",inp("venue",s.venue,{placeholder:"e.g. Session Hall, Municipal Building"}),true),
    fld("Agenda / Order of Business",txt("agenda",s.agenda,"1. Call to Order\n2. Invocation and National Anthem\n3. Roll Call\n4. Reading and Approval of the Minutes\n…"),true),
    fld("Reminders for attendees",txt("reminders",s.reminders,"e.g. Please review the draft ordinance before the session. Bring your committee report."),true,"Shown on the dashboard the day before and on the day of the meeting."),
    sec("Documents"),
    fld("Minutes (after the meeting)",inp("minutesLink",s.minutesLink,{type:"url",placeholder:"https://drive.google.com/…"}),true,"Appears in Minutes & Journal."),
    el("div",{class:"full",style:"display:flex;flex-direction:column;gap:8px"},
      el("span",{class:"hint"},"In Google Drive: right-click the file → Share → add the councilors’ emails (or “Anyone with the link”) → Copy link."),
      rows, el("div",{},el("button",{type:"button",class:"btn",onclick:()=>addRow()},icon("plus"),"Add document"))),
    sec("Measures for deliberation"), el("div",{class:"full"},mList),
    sec("Attendance"), el("div",{class:"full"},att)
  ], fd=>{
    const L=fd.getAll("fileLabel"), U=fd.getAll("fileUrl"), files=[];
    for(let i=0;i<U.length;i++){ const u=(U[i]||"").trim(), l=(L[i]||"").trim(); if(!u&&!l) continue;
      if(!safeUrl(u)) return `Document ${i+1}: the link must start with https://`; files.push({label:l||"Document "+(i+1),url:u}); }
    const d={kind:fd.get("kind"),committee:(fd.get("committee")||"").trim(),date:fd.get("date"),time:fd.get("time"),venue:fd.get("venue"),
      agenda:fd.get("agenda"),reminders:fd.get("reminders"),minutesLink:(fd.get("minutesLink")||"").trim(),files,measureIds:fd.getAll("measureIds"),present:fd.getAll("present")};
    if(!d.date) return "Please choose a date."; if(d.minutesLink&&!safeUrl(d.minutesLink)) return "The minutes link must start with https://";
    return save("sessions",s.id,d);
  }, s.id?()=>remove("sessions",s.id):null);
}
function memberForm(m={}){
  openDialog(m.id?"Edit member":"Add member",[
    fld("Full name",inp("name",m.name,{placeholder:"Hon. Juan Dela Cruz"}),true),
    fld("Position",sel("position",POSITIONS,m.position||"Councilor")),
    fld("Order in list",inp("order",m.order??"",{type:"number",min:"0"}),false,"Lower numbers appear first."),
    fld("Committee chairmanships",inp("committees",m.committees,{placeholder:"e.g. Finance; Tourism"}),true),
    fld("Contact",inp("contact",m.contact,{placeholder:"Email or mobile number"}),true)
  ], fd=>{
    const d=Object.fromEntries(fd); d.name=(d.name||"").trim(); if(!d.name) return "Please enter a name.";
    d.order=d.order===""?99:Number(d.order); return save("members",m.id,d);
  }, m.id?()=>remove("members",m.id):null);
}
function noticeForm(a={}){
  const chk=el("input",{type:"checkbox",name:"urgent",id:"in-urgent",checked:!!a.urgent,style:"width:auto;margin:0"});
  openDialog(a.id?"Edit notice":"New notice",[
    fld("Title",inp("title",a.title),true),
    fld("Date",inp("date",a.date||today(),{type:"date"})),
    fld("From",inp("author",a.author,{placeholder:"e.g. Secretary to the Sanggunian"})),
    fld("Message",txt("body",a.body),true),
    el("label",{class:"full",style:"flex-direction:row;align-items:center;gap:10px;font-weight:500"},chk,"Mark as important")
  ], fd=>{
    const d={title:(fd.get("title")||"").trim(),date:fd.get("date"),author:fd.get("author"),body:fd.get("body"),urgent:fd.get("urgent")==="on"};
    if(!d.title) return "Please enter a title."; return save("announcements",a.id,d);
  }, a.id?()=>remove("announcements",a.id):null);
}

function committeeForm(c={}){
  const opts=[["","— Select —"],...sortedMembers().map(m=>[m.id,m.name||"Unnamed"])];
  const set=new Set(c.memberIds||[]);
  const checks=el("div",{class:"checks"},sortedMembers().length?sortedMembers().map(m=>el("label",{},el("input",{type:"checkbox",name:"memberIds",value:m.id,id:"cm-"+m.id,checked:set.has(m.id)}),m.name||"Unnamed")):el("span",{class:"muted"},"Add members first."));
  openDialog(c.id?"Edit committee":"New committee",[
    fld("Committee name",inp("name",c.name,{placeholder:"e.g. Committee on Finance, Budget and Appropriations"}),true),
    fld("Chair",sel("chair",opts,c.chair||"")), fld("Vice chair",sel("viceChair",opts,c.viceChair||"")),
    fld("Jurisdiction / description",txt("description",c.description,"Matters covered by this committee"),true),
    sec("Members"), el("div",{class:"full"},checks)
  ], fd=>{
    const d={name:(fd.get("name")||"").trim(),chair:fd.get("chair"),viceChair:fd.get("viceChair"),description:fd.get("description"),memberIds:fd.getAll("memberIds")};
    if(!d.name) return "Please enter the committee name."; return save("committees",c.id,d);
  }, c.id?()=>remove("committees",c.id):null);
}
function commForm(c={}){
  openDialog(c.id?"Edit communication":"Log communication",[
    fld("Date received",inp("dateReceived",c.dateReceived||today(),{type:"date"})),
    fld("Reference no.",inp("refNo",c.refNo,{placeholder:"e.g. COMM-2026-118"})),
    fld("From",inp("sender",c.sender,{placeholder:"e.g. Office of the Municipal Mayor"}),true),
    fld("Subject",txt("subject",c.subject,"Subject of the letter, endorsement or request"),true),
    fld("Referred to",inp("referredTo",c.referredTo,{list:"committee-list",placeholder:"Committee"})),
    fld("Status",sel("status",COMM_STATUS.map(x=>x[0]),c.status||"Received")),
    fld("Document link",inp("link",c.link,{type:"url",placeholder:"https://drive.google.com/…"}),true),
    fld("Remarks",txt("remarks",c.remarks,""),true), committeeDatalist()
  ], fd=>{
    const d=Object.fromEntries(fd); d.subject=(d.subject||"").trim(); d.link=(d.link||"").trim();
    if(!d.subject) return "Please enter the subject."; if(d.link&&!safeUrl(d.link)) return "The document link must start with https://";
    return save("communications",c.id,d);
  }, c.id?()=>remove("communications",c.id):null);
}
function docForm(d={}){
  openDialog(d.id?"Edit document":"Add document",[
    fld("Title",inp("title",d.title,{placeholder:"e.g. Internal Rules of Procedure 2025–2028"}),true),
    fld("Category",sel("category",DOC_CATS,d.category||DOC_CATS[0])),
    fld("Date",inp("date",d.date||"",{type:"date"})),
    fld("Link",inp("url",d.url,{type:"url",placeholder:"https://drive.google.com/…"}),true,"Paste a Google Drive link. Make sure the file is shared with the councilors."),
    fld("Description",txt("description",d.description,""),true)
  ], fd=>{
    const x=Object.fromEntries(fd); x.title=(x.title||"").trim(); x.url=(x.url||"").trim();
    if(!x.title) return "Please enter a title."; if(!safeUrl(x.url)) return "Please paste a valid link starting with https://";
    return save("documents",d.id,x);
  }, d.id?()=>remove("documents",d.id):null);
}
function userForm(u={}){
  const self=u.id&&u.id===state.user.uid;
  const roleSel=sel("role",ROLES,u.role||"viewer"); const hint=el("span",{class:"hint"},ROLE_HINT[u.role||"viewer"]);
  roleSel.addEventListener("change",()=>{ hint.textContent=ROLE_HINT[roleSel.value]; });
  openDialog(u.id?"Edit user access":"Grant access",[
    fld("User UID",inp("uid",u.id,{readonly:u.id?true:null,placeholder:"Copied from Firebase console"}),true,u.id?null:"Firebase console → Authentication → Users → copy the User UID."),
    fld("Name",inp("name",u.name,{placeholder:"Hon. Juan Dela Cruz"})),
    fld("Email",inp("email",u.email,{type:"email"})),
    el("label",{class:"full"},"Role",roleSel,hint)
  ], fd=>{
    const uid=(fd.get("uid")||"").trim(); if(!uid) return "Please enter the User UID.";
    if(!/^[A-Za-z0-9]{10,128}$/.test(uid)) return "That doesn't look like a valid User UID. Copy it in full from the Firebase console.";
    const d={name:(fd.get("name")||"").trim(),email:(fd.get("email")||"").trim(),role:fd.get("role")};
    if(self&&d.role!=="admin") return "You can't remove your own administrator role.";
    return save("users",uid,d);
  }, (u.id&&!self)?()=>remove("users",u.id):null);
}

render();
</script>
</body>
